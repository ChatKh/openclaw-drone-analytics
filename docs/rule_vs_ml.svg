<text class="ink2" x="66" y="60" font-size="12"><tspan class="ink" font-weight="600">rule v2</tspan><tspan dx="6">precision 94%, 1 false alarm</tspan></text>
<rect class="s2" x="48" y="68" width="12" height="12" rx="2"/>
<text class="ink2" x="66" y="78" font-size="12"><tspan class="ink" font-weight="600">ml envelope</tspan><tspan dx="6">precision 100%, 0 false alarms</tspan></text>
