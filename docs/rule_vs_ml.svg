<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="t">Rule vs ML: recall by fault type</title>
<desc id="d">rule v2: battery 100%, gps 100%, sensor 100%, lipo 100%, all 100%; ml envelope: battery 100%, gps 100%, sensor 67%, lipo 100%, all 94%</desc>
<style>
  .bg{fill:#fcfcfb} .ink{fill:#0b0b0b} .ink2{fill:#52514e} .grid{stroke:#e4e3df} .base{stroke:#8a8984}
